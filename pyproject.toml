[project]
name = "budget-manager"
version = "0.1.0"
description = "A terminal budget manager with validated CSV storage"
readme = "README.md"
authors = [
    { name = "danielabachillerbracco", email = "daniela.s.work.001@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
budget-manager = "budget_manager.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
